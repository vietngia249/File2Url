<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File2Url - The Ethereal Conduit</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      .hero-gradient {
          background: radial-gradient(circle at 50% 50%, rgba(87, 223, 254, 0.15) 0%, rgba(53, 37, 205, 0.05) 100%);
      }
      .bg-ethereal-gradient {
        background: linear-gradient(135deg, #3525cd 0%, #4f46e5 50%, #57dffe 100%);
      }
      .text-gradient {
        background: linear-gradient(135deg, #3525cd, #571ac0);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
  </head>
  <body class="bg-background text-on-surface font-body overflow-x-hidden selection:bg-primary-fixed">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Decorative Ambient Glows for Background -->
    <div class="fixed inset-0 pointer-events-none -z-50 overflow-hidden">
        <div class="absolute -top-40 -left-40 w-[600px] h-[600px] bg-primary/10 blur-[150px] rounded-full mix-blend-multiply"></div>
        <div class="absolute top-[20%] -right-20 w-[500px] h-[500px] bg-secondary-container/20 blur-[120px] rounded-full mix-blend-multiply"></div>
        <div class="absolute -bottom-40 left-[20%] w-[800px] h-[600px] bg-tertiary-container/10 blur-[150px] rounded-[100%] mix-blend-multiply"></div>
    </div>
  </body>
</html>
